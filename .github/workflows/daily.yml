name: SEO daily

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST every day
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: seo-engine
  cancel-in-progress: false

defaults:
  run:
    working-directory: eggoz-seo-aeo   # engine lives in a subdirectory of this repo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eggoz-seo-aeo/package-lock.json

      - run: npm ci --omit=dev

      - name: Run daily collection
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: npm run daily

      - name: Commit results
        run: |
          git config user.name  "seo-engine[bot]"
          git config user.email "seo-engine@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "daily: $(date -u +%Y-%m-%d)"
          git push
