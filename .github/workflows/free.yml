name: SEO free (no Google)

# Google-free daily run. Needs no Google credential of any kind — no Search
# Console service account, no PageSpeed key, no Gemini key. Runs with zero
# secrets; add ANTHROPIC_API_KEY to unlock the answer-engine panel and drafts.

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-engine
  cancel-in-progress: false

defaults:
  run:
    working-directory: eggoz-seo-aeo   # engine lives in a subdirectory of this repo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eggoz-seo-aeo/package-lock.json

      - run: npm ci --omit=dev

      - name: Run Google-free collection
        env:
          # Both optional. With neither, the run still does the crawl,
          # performance probe, coverage discovery, schema and llms.txt.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: npm run free

      - name: Commit results
        run: |
          git config user.name  "seo-engine[bot]"
          git config user.email "seo-engine@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "free: $(date -u +%Y-%m-%d)"
          git push
