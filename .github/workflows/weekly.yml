name: AEO weekly

on:
  schedule:
    - cron: '0 2 * * 1'    # 07:30 IST every Monday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-engine
  cancel-in-progress: false

defaults:
  run:
    working-directory: eggoz-seo-aeo   # engine lives in a subdirectory of this repo

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eggoz-seo-aeo/package-lock.json

      - run: npm ci --omit=dev

      - name: Run weekly analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: npm run weekly

      - name: Commit results
        run: |
          git config user.name  "seo-engine[bot]"
          git config user.email "seo-engine@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "weekly: $(date -u +%Y-%m-%d)"
          git push
